<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTERAC TEACHER TRACKER</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header-section">
      <h2>INTERAC TEACHERS TRACKER</h2>
      <div class="date-note" id="date-range-note">Loading window...</div>
      <div class="search-area">
        <input type="text" id="q" placeholder="Enter Teacher Name (Ex. Clayd)" onkeypress="if(event.key==='Enter') doSearch()">
        <button id="btn" onclick="doSearch()">Search</button>
      </div>
      <div class="search-note">Type your Teacher's Name only do not add Teacher in the beginning.</div>
    </div>
    <div id="results-container" class="table-wrapper"><div id="results"></div></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
