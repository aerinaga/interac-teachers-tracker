<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Tracker</title>
  
  <link rel="stylesheet" href="styles.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <img src="JP%20Logo.png" alt="Background Logo" class="bg-logo">

  <div class="search-container">
    <h2>INTERAC LESSON TEACHERS TRACKER</h2>
    <p id="date-range-note"></p>
    
    <div class="search-box">
      <input type="text" id="q" placeholder="Enter Teacher Name (e.g., Lea)">
      <button onclick="doSearch()">Search</button>
    </div>
    <small>Type your Teacher's Name only (e.g., enter "Clayd", not "Teacher Clayd").</small>
  </div>

  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
